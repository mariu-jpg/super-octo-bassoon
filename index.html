<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleaning log✨</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #F9F7F2;
    --accent-orange: #E26D43;
    --accent-blue: #84A3BF;
    --text-main: #4A433F;
    --white: #FFFFFF;
    --card-shadow: 0 10px 25px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    padding-bottom: 100px;
  }

  .header {
    background-color: var(--white);
    padding: 20px;
    text-align: center;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
    box-shadow: var(--card-shadow);
  }
  .header h1 { font-size: 18px; color: var(--accent-orange); }

  .container { max-width: 500px; margin: 0 auto; padding: 20px; }

  .panel { display: none; }
  .panel.active { display: block; }

  .timer-card, .stats-card, .calendar-card {
    background: var(--white);
    border-radius: 24px;
    padding: 20px;
    box-shadow: var(--card-shadow);
    margin-bottom: 20px;
  }

  .timer-display { font-size: 42px; font-weight: 700; color: var(--accent-blue); text-align: center; margin: 10px 0; }
  .timer-controls { display: flex; justify-content: center; gap: 10px; }
  
  .btn {
    border: none; border-radius: 12px; padding: 10px 20px;
    font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn-orange { background: var(--accent-orange); color: var(--white); }
  .btn-blue { background: var(--accent-blue); color: var(--white); }
  .btn-outline { background: var(--white); border: 2px solid var(--bg-base); }

  .section-title { font-size: 13px; font-weight: 700; margin: 15px 0 8px; color: var(--accent-blue); }
  
  /* タブ・ボタン生成エリア */
  .loc-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .loc-tab {
    white-space: nowrap; padding: 6px 14px; border-radius: 15px; background: var(--white);
    font-size: 12px; font-weight: 700; cursor: pointer; border: none;
  }
  .loc-tab.active { background: var(--accent-blue); color: var(--white); }

  .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  .task-btn {
    background: var(--white); border: none; border-radius: 12px; padding: 12px 5px;
    font-size: 12px; font-weight: 700; box-shadow: 0 2px 5px rgba(0,0,0,0.02); cursor: pointer;
  }

  /* 統計用 */
  .stats-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .stat-box { background: var(--bg-base); padding: 10px; border-radius: 12px; text-align: center; }
  .stat-val { font-size: 18px; font-weight: 700; color: var(--accent-orange); }
  .stat-label { font-size: 10px; color: #888; }
  .bar-chart { margin-top: 10px; }
  .bar-row { display: flex; align-items: center; margin-bottom: 5px; font-size: 11px; }
  .bar-label { width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-fill { height: 8px; background: var(--accent-blue); border-radius: 4px; transition: width 0.3s; }

  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--white);
    display: flex; justify-content: space-around; padding: 12px 0;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.03);
  }
  .nav-item { border: none; background: none; color: #BBB; font-size: 10px; font-weight: 700; cursor: pointer; }
  .nav-item.active { color: var(--accent-orange); }
</style>
</head>
<body>

<div class="header">
  <h1>おそうじログ</h1>
</div>

<div class="container">
  <div id="panel-log" class="panel active">
    <div class="timer-card">
      <div id="timerDisplay" class="timer-display">00:00</div>
      <div class="timer-controls">
        <button id="timerBtn" class="btn btn-orange" onclick="toggleTimer()">スタート</button>
        <button class="btn btn-outline" onclick="resetTimer()">リセット</button>
      </div>
    </div>

    <div class="section-title">テンプレート</div>
    <div id="categoryTabs" class="loc-tabs"></div>
    <div id="taskButtons" class="template-grid"></div>
  </div>

  <div id="panel-cal" class="panel">
    <div class="stats-card">
      <div class="section-title" style="margin-top:0">今月の統計</div>
      <div class="stats-summary">
        <div class="stat-box">
          <div class="stat-label">今月合計</div>
          <div id="monthTotal" class="stat-val">0分</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">今週合計</div>
          <div id="weekTotal" class="stat-val">0分</div>
        </div>
      </div>
      <div class="section-title">場所別（月間）</div>
      <div id="locationStats" class="bar-chart"></div>
    </div>

    <div class="calendar-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <button onclick="changeMonth(-1)">◀</button>
        <div id="calTitle" style="font-weight:700"></div>
        <button onclick="changeMonth(1)">▶</button>
      </div>
      <div class="cal-grid" id="calendarGrid" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; text-align:center; font-size:12px;"></div>
    </div>
  </div>
</div>

<nav class="nav-bar">
  <button class="nav-item active" onclick="switchTab('log', this)">🧹 記録</button>
  <button class="nav-item" onclick="switchTab('cal', this)">📅 統計</button>
</nav>

<script>
// ★ カテゴリを追加したい時はここを編集！
const TASKS = {
  living: { name: "リビング", items: ["掃除機", "床拭き", "片付け"] },
  kitchen: { name: "キッチン", items: ["シンク", "コンロ", "冷蔵庫"] },
  bath: { name: "水まわり", items: ["お風呂", "トイレ", "洗面台"] },
  other: { name: "その他", items: ["ゴミ捨て", "玄関", "洗濯"] }
  // 例: bedroom: { name: "寝室", items: ["シーツ交換", "枕干し"] } 
};

const GAS_URL = "ここにデプロイしたGASのURLを貼る";

let logs = JSON.parse(localStorage.getItem('clean_logs') || '[]');
let timerInterval, seconds = 0, isRunning = false, currentMonth = new Date();

function init() {
  renderCategoryTabs();
  renderCalendar();
  updateStats();
}

// カテゴリタブの動的生成
function renderCategoryTabs() {
  const container = document.getElementById('categoryTabs');
  container.innerHTML = Object.keys(TASKS).map((key, index) => `
    <button class="loc-tab ${index===0?'active':''}" onclick="filterTasks('${key}', this)">
      ${TASKS[key].name}
    </button>
  `).join('');
  filterTasks(Object.keys(TASKS)[0], container.firstElementChild);
}

function filterTasks(key, el) {
  document.querySelectorAll('.loc-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('taskButtons').innerHTML = TASKS[key].items.map(t => `
    <button class="task-btn" onclick="saveRecord('${t}', '${key}')">${t}</button>
  `).join('');
}

async function saveRecord(taskName, category, manualMin = null) {
  const duration = manualMin || Math.ceil(seconds / 60) || 1;
  const entry = {
    date: new Date().toLocaleDateString('ja-JP'),
    task: taskName,
    category: category, // 場所別集計用
    duration: parseInt(duration),
    timestamp: new Date().getTime()
  };

  logs.unshift(entry);
  localStorage.setItem('clean_logs', JSON.stringify(logs));
  
  if (GAS_URL) {
    try {
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(entry) });
    } catch(e) { console.error("GAS送信失敗", e); }
  }

  alert(`「${taskName}」を記録しました`);
  resetTimer();
  updateStats();
  renderCalendar();
}

function updateStats() {
  const now = new Date();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));

  const monthLogs = logs.filter(l => new Date(l.timestamp) >= startOfMonth);
  const weekLogs = logs.filter(l => new Date(l.timestamp) >= startOfWeek);

  const mTotal = monthLogs.reduce((sum, l) => sum + l.duration, 0);
  const wTotal = weekLogs.reduce((sum, l) => sum + l.duration, 0);

  document.getElementById('monthTotal').textContent = `${mTotal}分`;
  document.getElementById('weekTotal').textContent = `${wTotal}分`;

  // 場所別集計（月間）
  const catStats = {};
  monthLogs.forEach(l => {
    catStats[l.category] = (catStats[l.category] || 0) + l.duration;
  });

  const statsHtml = Object.keys(TASKS).map(key => {
    const val = catStats[key] || 0;
    const percent = mTotal > 0 ? (val / mTotal * 100) : 0;
    return `
      <div class="bar-row">
        <div class="bar-label">${TASKS[key].name}</div>
        <div style="flex:1; margin:0 10px;"><div class="bar-fill" style="width:${percent}%"></div></div>
        <div style="width:30px; text-align:right">${val}分</div>
      </div>
    `;
  }).join('');
  document.getElementById('locationStats').innerHTML = statsHtml;
}

// --- タイマー・カレンダー・タブ切り替えロジック (基本維持) ---
function toggleTimer() {
  const btn = document.getElementById('timerBtn');
  if (!isRunning) {
    isRunning = true; btn.textContent = "ストップ";
    timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
  } else { stopTimer(); }
}
function stopTimer() { clearInterval(timerInterval); isRunning = false; document.getElementById('timerBtn').textContent = "スタート"; }
function resetTimer() { stopTimer(); seconds = 0; updateTimerDisplay(); }
function updateTimerDisplay() {
  const m = Math.floor(seconds/60), s = seconds%60;
  document.getElementById('timerDisplay').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function switchTab(tab, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${tab}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}
function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
  document.getElementById('calTitle').textContent = `${y}年${m+1}月`;
  grid.innerHTML = '';
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
  for(let i=0; i<first; i++) grid.appendChild(document.createElement('div'));
  for(let d=1; d<=days; d++){
    const day = document.createElement('div');
    day.textContent = d;
    day.style.padding = "5px";
    if(logs.some(l => new Date(l.timestamp).toDateString() === new Date(y,m,d).toDateString())) day.style.color = "var(--accent-orange)";
    grid.appendChild(day);
  }
}
function changeMonth(d) { currentMonth.setMonth(currentMonth.getMonth()+d); renderCalendar(); }

init();
</script>
</body>
</html>
