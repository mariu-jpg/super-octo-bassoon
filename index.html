<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cleaning log✨</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #F9F7F2;
    --accent-orange: #E26D43;
    --accent-blue: #84A3BF;
    --text-main: #4A433F;
    --white: #FFFFFF;
    --card-shadow: 0 10px 25px rgba(0,0,0,0.04);
    --danger: #D94F4F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    padding-bottom: 80px;
  }

  .header {
    background-color: var(--white);
    padding: 20px;
    text-align: center;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
    box-shadow: var(--card-shadow);
  }
  .header h1 { font-size: 18px; color: var(--accent-orange); }

  .container { max-width: 500px; margin: 0 auto; padding: 20px; }

  .panel { display: none; }
  .panel.active { display: block; }

  .timer-card, .stats-card, .calendar-card, .log-card {
    background: var(--white);
    border-radius: 24px;
    padding: 20px;
    box-shadow: var(--card-shadow);
    margin-bottom: 20px;
  }

  .timer-display { font-size: 42px; font-weight: 700; color: var(--accent-blue); text-align: center; margin: 10px 0; }
  .timer-controls { display: flex; justify-content: center; gap: 10px; }

  .btn {
    border: none; border-radius: 12px; padding: 10px 20px;
    font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  .btn-orange { background: var(--accent-orange); color: var(--white); }
  .btn-blue { background: var(--accent-blue); color: var(--white); }
  .btn-outline { background: var(--white); border: 2px solid var(--bg-base); color: var(--text-main); }
  .btn-danger { background: var(--danger); color: var(--white); }
  .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 8px; }

  .section-title { font-size: 13px; font-weight: 700; margin: 15px 0 8px; color: var(--accent-blue); }

  .loc-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .loc-tab {
    white-space: nowrap; padding: 6px 14px; border-radius: 15px; background: var(--white);
    font-size: 12px; font-weight: 700; cursor: pointer; border: none; box-shadow: var(--card-shadow);
  }
  .loc-tab.active { background: var(--accent-orange); color: var(--white); }

  .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  .task-btn {
    background: var(--white); border: none; border-radius: 12px; padding: 12px 5px;
    font-size: 12px; font-weight: 700; box-shadow: 0 2px 5px rgba(0,0,0,0.04); cursor: pointer;
    transition: background 0.15s; color: #484848;
  }
  .task-btn:active { background: var(--bg-base); }

  /* ① タイマー手入力 — font-size:16px でSP自動拡大を防止 */
  .timer-manual {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;
  }
  .timer-manual input {
    width: 120px; padding: 10px 12px;
    border: 2px solid var(--bg-base); border-radius: 12px;
    font-family: inherit; font-size: 16px;
    font-weight: 700; text-align: center;
    color: var(--text-main); outline: none;
  }
  .timer-manual input:focus { border-color: var(--accent-blue); }
  .btn-set {
    width: 90px; padding: 10px; font-size: 13px; border-radius: 12px;
    background: var(--bg-base); border: 2px solid var(--bg-base);
    font-family: inherit; font-weight: 700; cursor: pointer;
    color: var(--text-main); transition: all 0.15s; text-align: center;
  }
  .btn-set:active { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }

  /* ③ テンプレートと自由入力の間の余白 */
  .free-input-section { margin-top: 24px; }

  /* ② 自由入力 — 常時表示・min-width:0 で幅崩れ防止・font-size:16px でSP拡大防止 */
  .custom-input-row { display: flex; gap: 8px; margin-top: 8px; }
  .custom-input-row input {
    flex: 1; min-width: 0;
    padding: 11px 14px; border: 2px solid var(--bg-base); border-radius: 14px;
    font-family: inherit; font-size: 16px;
    font-weight: 700; color: var(--text-main); outline: none;
  }
  .custom-input-row input:focus { border-color: var(--accent-orange); }
  .custom-input-row button {
    flex-shrink: 0;
    padding: 11px 18px; border: none; border-radius: 14px;
    background: var(--accent-orange); color: white;
    font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }

  /* 集計 */
  .period-toggle {
    display: flex; background: var(--bg-base); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 14px;
  }
  .period-btn {
    flex: 1; border: none; border-radius: 10px; padding: 7px; font-family: inherit;
    font-size: 12px; font-weight: 700; cursor: pointer; background: transparent; color: #AAA;
    transition: all 0.15s;
  }
  .period-btn.active { background: var(--white); color: var(--accent-orange); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  .stats-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-box { background: var(--bg-base); padding: 12px 10px; border-radius: 14px; text-align: center; }
  .stat-val { font-size: 20px; font-weight: 700; color: var(--accent-orange); }
  .stat-label { font-size: 10px; color: #AAA; margin-top: 2px; }

  /* 場所別比率バー */
  .bar-chart { margin-top: 4px; }
  .bar-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 11px; gap: 8px; }
  .bar-label { width: 54px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--bg-base); border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent-blue); border-radius: 6px; transition: width 0.4s; }
  .bar-pct { width: 30px; text-align: right; color: var(--accent-orange); font-weight: 700; flex-shrink: 0; }

  /* カレンダー */
  .cal-day-header { font-size: 10px; color: #AAA; font-weight: 700; }
  .cal-cell { padding: 5px 2px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .cal-cell.has-log { color: var(--accent-orange); font-weight: 700; }
  .cal-cell.today { background: var(--accent-orange); color: var(--white) !important; font-weight: 700; }

  /* ログ一覧 */
  .log-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--bg-base); font-size: 13px;
  }
  .log-item:last-child { border-bottom: none; }
  .log-info { flex: 1; }
  .log-task { font-weight: 700; }
  .log-meta { font-size: 11px; color: #AAA; margin-top: 2px; }
  .log-del { background: none; border: none; color: #CCC; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .log-del:hover { background: #FFF0F0; color: var(--danger); }

  /* スピナー */
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* トースト */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--text-main); color: white; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 700; opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ④ ナビバー — padding増・アイコン＋ラベル縦並びで高さアップ */
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--white);
    display: flex; justify-content: space-around;
    padding: 12px 0 20px;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
  }
  .nav-item {
    border: none; background: none; color: #BBB; font-size: 10px; font-weight: 700;
    cursor: pointer; padding: 4px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .nav-icon { font-size: 22px; line-height: 1; }
  .nav-item.active { color: var(--accent-orange); }
</style>
</head>
<body>

<div class="header">
  <h1>おそうじログ ✨</h1>
</div>

<div class="container">

  <!-- ===== 記録パネル ===== -->
  <div id="panel-log" class="panel active">

    <!-- タイマー -->
    <div class="timer-card">
      <div id="timerDisplay" class="timer-display">00:00</div>
      <div class="timer-controls">
        <button id="timerBtn" class="btn btn-orange" onclick="toggleTimer()">スタート</button>
        <button class="btn btn-outline" onclick="resetTimer()">リセット</button>
      </div>
      <!-- ① 手入力（拡大なし） -->
      <div class="timer-manual">
        <input type="number" id="manualMin" placeholder="分を入力" min="0" max="99" inputmode="numeric">
        <button class="btn-set" onclick="setManualTimer()">セット</button>
      </div>
    </div>

    <!-- テンプレート -->
    <div class="section-title">テンプレート</div>
    <div id="categoryTabs" class="loc-tabs"></div>
    <div id="taskButtons" class="template-grid" style="margin-top:8px"></div>

    <!-- ②③ 自由入力（常時表示・余白あり・幅崩れ修正） -->
    <div class="free-input-section">
      <div class="section-title" style="margin-top:0">自由入力</div>
      <div class="custom-input-row">
        <input type="text" id="customTaskInput" placeholder="例：窓を拭いた、靴を磨いた…">
        <button onclick="saveCustomRecord()">＋</button>
      </div>
    </div>

  </div><!-- /panel-log -->

  <!-- ===== 統計パネル ===== -->
  <div id="panel-stats" class="panel">
    <div class="stats-card">
      <div class="period-toggle">
        <button class="period-btn active" id="btnMonth" onclick="setPeriod('month')">月間</button>
        <button class="period-btn" id="btnWeek" onclick="setPeriod('week')">週間（月曜始まり）</button>
      </div>
      <div class="stats-summary">
        <div class="stat-box">
          <div class="stat-label" id="totalLabel">今月の合計</div>
          <div id="totalTime" class="stat-val">0分</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">記録回数</div>
          <div id="totalCount" class="stat-val">0回</div>
        </div>
      </div>
      <div class="section-title">場所別の比率</div>
      <div id="locationStats" class="bar-chart"></div>
    </div>

    <div class="calendar-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <button class="btn btn-outline btn-sm" onclick="changeMonth(-1)">◀</button>
        <div id="calTitle" style="font-weight:700;font-size:14px;"></div>
        <button class="btn btn-outline btn-sm" onclick="changeMonth(1)">▶</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;" id="calendarGrid"></div>
    </div>

    <div class="log-card" id="dayDetailCard" style="display:none">
      <div class="section-title" id="dayDetailTitle"></div>
      <div id="dayDetailBody"></div>
    </div>
  </div>

  <!-- ===== ログ一覧パネル ===== -->
  <div id="panel-list" class="panel">
    <div class="log-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="section-title" style="margin:0">記録一覧</div>
        <button class="btn btn-outline btn-sm" onclick="syncFromSheets()">🔄 読み込み</button>
      </div>
      <div id="logList"></div>
    </div>
  </div>

</div><!-- /container -->

<!-- ④ ナビバー（アイコン+ラベル縦並び） -->
<nav class="nav-bar">
  <button class="nav-item active" onclick="switchTab('log', this)">
    <span class="nav-icon">🧹</span>記録
  </button>
  <button class="nav-item" onclick="switchTab('stats', this); updateStats(); renderCalendar();">
    <span class="nav-icon">📊</span>統計
  </button>
  <button class="nav-item" onclick="switchTab('list', this); renderLogList();">
    <span class="nav-icon">📋</span>一覧
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const TASKS = {
  living:  { name: "リビング", items: ["全般", "床拭き", "片付け", "テーブル拭き", "ゴミ捨て"] },
  kitchen: { name: "キッチン", items: ["全般", "シンク", "コンロ", "片付け", "冷蔵庫", "棚拭き", "床拭き"] },
  bath:    { name: "水まわり", items: ["全般", "お風呂", "トイレ", "洗面台", "鏡を拭く", "排水口"] },
  bedroom: { name: "寝室",    items: ["全般", "布団を整える", "床掃き", "クローゼット整理"] },
  other:   { name: "その他",  items: ["玄関", "洗濯", "窓を拭く", "靴を揃える"] }
};

let logs = [];
let timerInterval, seconds = 0, isRunning = false;
let currentMonth = new Date();
let statsPeriod = 'month';
const gasUrl = 'ここにGAS URLを貼り付ける'; // ← デプロイ後のURLに書き換えてください

function init() {
  const cached = localStorage.getItem('clean_logs');
  if (cached) logs = JSON.parse(cached);
  renderCategoryTabs();
  updateStats();
  renderCalendar();
}

function toggleTimer() {
  const btn = document.getElementById('timerBtn');
  if (!isRunning) {
    isRunning = true; btn.textContent = "ストップ";
    timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
  } else { stopTimer(); }
}
function stopTimer() {
  clearInterval(timerInterval); isRunning = false;
  document.getElementById('timerBtn').textContent = "スタート";
}
function resetTimer() { stopTimer(); seconds = 0; updateTimerDisplay(); }
function updateTimerDisplay() {
  const m = Math.floor(seconds / 60), s = seconds % 60;
  document.getElementById('timerDisplay').textContent =
    `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function setManualTimer() {
  if (isRunning) return;
  const m = parseInt(document.getElementById('manualMin').value) || 0;
  seconds = m * 60;
  updateTimerDisplay();
  document.getElementById('manualMin').value = '';
}

async function saveCustomRecord() {
  const input = document.getElementById('customTaskInput');
  const taskName = input.value.trim();
  if (!taskName) { input.focus(); return; }
  input.value = '';
  await saveRecord(taskName, 'other', null);
}

function renderCategoryTabs() {
  const container = document.getElementById('categoryTabs');
  container.innerHTML = Object.keys(TASKS).map((key, i) => `
    <button class="loc-tab ${i === 0 ? 'active' : ''}" onclick="filterTasks('${key}', this)">
      ${TASKS[key].name}
    </button>`).join('');
  filterTasks(Object.keys(TASKS)[0], container.firstElementChild);
}
function filterTasks(key, el) {
  document.querySelectorAll('.loc-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('taskButtons').innerHTML = TASKS[key].items.map(t => `
    <button class="task-btn" onclick="saveRecord('${t}','${key}',this)">${t}</button>`).join('');
}

async function saveRecord(taskName, category, btn) {
  const duration = Math.ceil(seconds / 60) || 1;
  const now = new Date();
  const entry = {
    id: now.getTime().toString(),
    date: now.toLocaleDateString('ja-JP'),
    task: taskName, category, duration,
    timestamp: now.getTime()
  };
  logs.unshift(entry);
  saveLocal(); resetTimer(); updateStats(); renderCalendar();
  showToast(`「${taskName}」を記録しました ✓`);

  if (!gasUrl || gasUrl.includes('貼り付け')) return;
  const orig = btn ? btn.textContent : '';
  if (btn) btn.innerHTML = '<span class="spinner"></span>';
  try {
    await fetch(gasUrl, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'add', entry })
    });
    if (btn) btn.textContent = '✓ 保存済み';
    setTimeout(() => { if (btn) btn.textContent = orig; }, 1500);
  } catch(e) { console.error('GAS送信失敗', e); if (btn) btn.textContent = orig; }
}
function saveLocal() { localStorage.setItem('clean_logs', JSON.stringify(logs)); }

async function syncFromSheets() {
  if (!gasUrl || gasUrl.includes('貼り付け')) { showToast('GAS URL が設定されていません'); return; }
  showToast('🔄 読み込み中…');
  try {
    const res = await fetch(gasUrl + '?action=getAll');
    const data = await res.json();
    if (Array.isArray(data)) {
      logs = data; saveLocal(); updateStats(); renderCalendar(); renderLogList();
      showToast(`✅ ${logs.length}件 読み込みました`);
    }
  } catch(e) { showToast('⚠ 読み込みに失敗しました'); console.error(e); }
}

async function deleteLog(id) {
  logs = logs.filter(l => l.id !== id);
  saveLocal(); updateStats(); renderCalendar(); renderLogList();
  showToast('削除しました');
  if (!gasUrl || gasUrl.includes('貼り付け')) return;
  try {
    await fetch(gasUrl, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'delete', id })
    });
  } catch(e) { console.error('GAS削除失敗', e); }
}

function setPeriod(p) {
  statsPeriod = p;
  document.getElementById('btnMonth').classList.toggle('active', p === 'month');
  document.getElementById('btnWeek').classList.toggle('active', p === 'week');
  updateStats();
}
function getPeriodLogs() {
  const now = new Date(); let start;
  if (statsPeriod === 'month') {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
  } else {
    const day = now.getDay(), diffToMon = (day === 0) ? 6 : day - 1;
    start = new Date(now); start.setDate(now.getDate() - diffToMon); start.setHours(0,0,0,0);
  }
  return logs.filter(l => new Date(l.timestamp) >= start);
}
function updateStats() {
  const filtered = getPeriodLogs();
  const total = filtered.reduce((s, l) => s + l.duration, 0);
  document.getElementById('totalLabel').textContent = statsPeriod === 'month' ? '今月の合計' : '今週の合計（月曜〜）';
  document.getElementById('totalTime').textContent = `${total}分`;
  document.getElementById('totalCount').textContent = `${filtered.length}回`;
  const catMap = {};
  filtered.forEach(l => { catMap[l.category] = (catMap[l.category] || 0) + l.duration; });
  document.getElementById('locationStats').innerHTML = Object.keys(TASKS).map(key => {
    const val = catMap[key] || 0, pct = total > 0 ? Math.round(val / total * 100) : 0;
    return `<div class="bar-row">
      <div class="bar-label">${TASKS[key].name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-pct">${pct}%</div>
    </div>`;
  }).join('');
}

function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
  document.getElementById('calTitle').textContent = `${y}年${m + 1}月`;
  grid.innerHTML = '';
  ['月','火','水','木','金','土','日'].forEach(d => {
    const h = document.createElement('div'); h.className = 'cal-day-header'; h.textContent = d; grid.appendChild(h);
  });
  const firstDow = new Date(y, m, 1).getDay();
  const firstMon = (firstDow === 0) ? 6 : firstDow - 1;
  const days = new Date(y, m + 1, 0).getDate();
  const todayStr = new Date().toDateString();
  for (let i = 0; i < firstMon; i++) grid.appendChild(document.createElement('div'));
  for (let d = 1; d <= days; d++) {
    const cell = document.createElement('div'); cell.className = 'cal-cell'; cell.textContent = d;
    const dateObj = new Date(y, m, d);
    if (logs.some(l => new Date(l.timestamp).toDateString() === dateObj.toDateString())) cell.classList.add('has-log');
    if (dateObj.toDateString() === todayStr) cell.classList.add('today');
    cell.onclick = () => showDayDetail(y, m, d);
    grid.appendChild(cell);
  }
}
function changeMonth(d) { currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + d, 1); renderCalendar(); }
function showDayDetail(y, m, d) {
  const target = new Date(y, m, d).toDateString();
  const dayLogs = logs.filter(l => new Date(l.timestamp).toDateString() === target);
  const card = document.getElementById('dayDetailCard');
  document.getElementById('dayDetailTitle').textContent = `${y}年${m + 1}月${d}日`;
  document.getElementById('dayDetailBody').innerHTML = dayLogs.length === 0
    ? '<div style="color:#CCC;font-size:13px;padding:8px 0">記録なし</div>'
    : dayLogs.map(l => `<div class="log-item">
        <div class="log-info">
          <div class="log-task">${l.task}</div>
          <div class="log-meta">${TASKS[l.category]?.name || l.category} · ${l.duration}分</div>
        </div>
        <button class="log-del" onclick="deleteLog('${l.id}');document.getElementById('dayDetailCard').style.display='none'" title="削除">🗑</button>
      </div>`).join('');
  card.style.display = '';
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderLogList() {
  const el = document.getElementById('logList');
  el.innerHTML = logs.length === 0
    ? '<div style="color:#CCC;font-size:13px;padding:8px 0">記録がありません</div>'
    : logs.slice(0, 100).map(l => `<div class="log-item">
        <div class="log-info">
          <div class="log-task">${l.task}</div>
          <div class="log-meta">${l.date} · ${TASKS[l.category]?.name || l.category} · ${l.duration}分</div>
        </div>
        <button class="log-del" onclick="deleteLog('${l.id}')" title="削除">🗑</button>
      </div>`).join('');
}

function switchTab(tab, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${tab}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
